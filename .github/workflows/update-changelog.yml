name: Auto Update Changelog

on:
  release:
    types: [published]

permissions:
  contents: write

# Keep README updates ordered when TV and Lite releases are published close together.
concurrency:
  group: release-readme-changelog
  cancel-in-progress: false

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check Release Tag
        id: check
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          if [[ "$TAG" =~ ^homeio-(lite-)?v\.[0-9]+(\.[0-9]+)+$ ]]; then
            echo "PROCEED=true" >> "$GITHUB_OUTPUT"
            echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "PROCEED=false" >> "$GITHUB_OUTPUT"
            echo "Release tag is not a supported HOME.iO channel; skipping."
          fi

      - name: Validate published release APK asset
        id: validate
        if: steps.check.outputs.PROCEED == 'true'
        env:
          TAG: ${{ steps.check.outputs.TAG }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            -o "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP/release.json" "$TAG" <<'PY'
          import json, sys
          release = json.load(open(sys.argv[1], encoding="utf-8"))
          tag = sys.argv[2]
          if release.get("tag_name") != tag or release.get("draft") or release.get("prerelease"):
              raise SystemExit("Release metadata does not match a published stable tag.")
          expected = "HOME.iO-TV-Lite.apk" if tag.startswith("homeio-lite-v.") else "HOME.iO-TV.apk"
          assets = [a for a in release.get("assets", []) if a.get("name", "").lower().endswith(".apk")]
          if len(assets) != 1 or assets[0].get("name") != expected:
              names = [a.get("name", "") for a in assets]
              raise SystemExit(f"{tag} must contain exactly one {expected}; found {names}.")
          url = assets[0].get("browser_download_url", "")
          trusted = "https://github.com/andikune-ux/dev.andikune-apps/releases/download/"
          if not url.startswith(trusted):
              raise SystemExit("Release APK URL is outside the trusted distribution repository.")
          if assets[0].get("size", 0) <= 0:
              raise SystemExit("Release APK asset has an invalid size.")
          print(f"Validated {tag}: {expected} ({assets[0]['size']} bytes).")
          PY

      - name: Update release links and changelog in README
        if: steps.check.outputs.PROCEED == 'true' && steps.validate.outcome == 'success'
        env:
          TAG: ${{ steps.check.outputs.TAG }}
          BODY: ${{ github.event.release.body }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
        run: |
          python3 <<'PYEOF'
          import os
          import re
          import sys
          from datetime import datetime
          from zoneinfo import ZoneInfo

          tag = os.environ["TAG"].strip()
          body = (os.environ.get("BODY") or "").strip()
          published_at = os.environ.get("PUBLISHED_AT", "").strip()

          if tag.startswith("homeio-lite-v."):
              edition = "Lite"
              prefix = "homeio-lite-v."
              min_android = "Android 6.0"
              details_open = ""
          elif tag.startswith("homeio-v."):
              edition = "TV"
              prefix = "homeio-v."
              min_android = "Android 7.0"
              details_open = " open"
          else:
              sys.exit(f"Unsupported release channel: {tag}")

          version = tag[len(prefix):]
          if not re.fullmatch(r"\d+(\.\d+)+", version):
              sys.exit(f"Invalid version in release tag: {tag}")

          def version_tuple(value):
              try:
                  return tuple(int(part) for part in value.split("."))
              except ValueError:
                  return ()

          if published_at:
              published = datetime.fromisoformat(published_at.replace("Z", "+00:00"))
              release_date = published.astimezone(ZoneInfo("Asia/Jakarta")).strftime("%d %B %Y")
          else:
              release_date = datetime.now(ZoneInfo("Asia/Jakarta")).strftime("%d %B %Y")

          body = re.sub(
              r"^#+\s*(Rincian Pembaruan|Release Notes|Changelog)\s*\n+",
              "",
              body,
              flags=re.IGNORECASE | re.MULTILINE,
          ).strip()
          if not body:
              body = "- Tidak ada rincian pembaruan."

          # Keep the repository landing page concise; the full notes remain on
          # the individual GitHub Release page linked below.
          body_lines = [
              line.strip()
              for line in body.splitlines()
              if line.strip()
              and not line.strip().lower().startswith("**full changelog**")
          ]
          if len(body_lines) > 12:
              body_lines = body_lines[:12] + ["- ... dan perbaikan lainnya."]
          body = "\n".join(body_lines)

          with open("README.md", "r", encoding="utf-8") as file:
              readme = file.read()

          # Do not let an older release event downgrade the public download links.
          version_pattern = (
              r"<sub>Versi rilis: <b>([^<]+)</b> · Minimum Android "
              + re.escape("6.0" if edition == "Lite" else "7.0")
              + r"</sub>"
          )
          current_match = re.search(version_pattern, readme)
          current_version = current_match.group(1) if current_match else ""
          if current_version and version_tuple(current_version) > version_tuple(version):
              print(
                  f"Skipping stale {edition} release {version}; "
                  f"README already advertises {current_version}."
              )
              sys.exit(0)

          # Update every public download/changelog URL for this edition only.
          tag_pattern = r"homeio-lite-v\.[0-9]+(?:\.[0-9]+)+" if edition == "Lite" else r"homeio-v\.[0-9]+(?:\.[0-9]+)+"
          readme = re.sub(tag_pattern, tag, readme)

          # Keep the edition's visible version label in sync with its release tag.
          readme = re.sub(
              version_pattern,
              f"<sub>Versi rilis: <b>{version}</b> · Minimum Android "
              + ("6.0" if edition == "Lite" else "7.0")
              + "</sub>",
              readme,
              count=1,
          )

          title = f"HOME.iO {edition}"
          details_pattern = (
              r"<details(?: open)?>\s*<summary><b>"
              + re.escape(title)
              + r" — v.*?</details>"
          )
          new_details = (
              f"<details{details_open}>\n"
              f"<summary><b>{title} — v{version}</b> · {release_date}</summary>\n\n"
              f"{body}\n\n"
              f"[Lihat detail rilis HOME.iO {edition}]"
              f"(https://github.com/andikune-ux/dev.andikune-apps/releases/tag/{tag})\n\n"
              f"</details>"
          )

          if re.search(details_pattern, readme, flags=re.DOTALL):
              readme = re.sub(
                  details_pattern,
                  lambda _: new_details,
                  readme,
                  count=1,
                  flags=re.DOTALL,
              )
          else:
              section = "## 📝 Rilis terbaru"
              if section not in readme:
                  readme = readme.rstrip() + "\n\n" + section + "\n"
              readme = readme.replace(section, section + "\n\n" + new_details, 1)

          with open("README.md", "w", encoding="utf-8") as file:
              file.write(readme)

          print(f"Updated HOME.iO {edition} README links and changelog to {version}.")
          PYEOF

      - name: Commit and Push
        if: steps.check.outputs.PROCEED == 'true' && steps.validate.outcome == 'success'
        env:
          TAG: ${{ steps.check.outputs.TAG }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No README changes are needed."
            exit 0
          fi
          git commit -m "📝 Sync README changelog for $TAG"

          # A TV and Lite release may finish together. Rebase and retry if
          # the other workflow updates main first.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; rebasing on latest main."
            git pull --rebase origin main
            sleep "$attempt"
          done
          echo "::error::Could not push README changelog after 5 attempts."
          exit 1
